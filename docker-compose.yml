# Run ResumeAI locally in containers. Full guide: docs/DOCKER.md
#
#   docker compose --env-file frontend/.env up --build
#
# backend  -> http://localhost:8000  (settings from backend/.env)
# frontend -> http://localhost:3000  (VITE_* build args from the --env-file)
# Add `--profile local-db` to also start MongoDB and set
# MONGO_URL=mongodb://mongo:27017 in backend/.env.

services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false   # CI builds the images without it
    environment:
      PORT: "8000"
      # The browser reaches the app on port 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - resumes:/home/user/resumes
      - hf-cache:/home/user/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:8
    profiles: ["local-db"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  resumes:
  hf-cache:
  mongo-data:
