version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # langextract (resume parsing) runs on google-genai; a new major needs
      # testing with it and newer google-auth/pydantic pins, so it is done by hand
      - dependency-name: google-genai
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
