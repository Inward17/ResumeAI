# CI on every pull request and push; CD on pushes to main:
#   frontend → GitHub Pages, backend → Hugging Face Docker Space.
# Setup (repository variables and secrets) is described in docs/DEPLOYMENT.md.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: >
          pip install
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          -r backend/requirements.txt
      - name: Run pytest
        env:
          # Tests mock every external service and database
          AUTH_DISABLED: "false"
          FIREBASE_PROJECT_ID: ci-test
        run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          # Default the API to the Hugging Face Space URL (owner-name.hf.space)
          if [ -z "$VITE_API_URL" ] && [ -n "$HF_SPACE" ]; then
            export VITE_API_URL="https://$(echo "$HF_SPACE" | tr '[:upper:]/_.' '[:lower:]---').hf.space"
          fi
          echo "API URL: ${VITE_API_URL:-<not set>}"
          yarn build
          # Single-page app: serve index.html for deep links like /jobs/<id>
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Deploy backend to Hugging Face
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "huggingface_hub>=0.25"
      - name: Upload backend and sync settings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Optional: any of these set as GitHub secrets are copied to the Space's secrets
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN_FOR_VERIFICATION: ${{ secrets.GH_VERIFICATION_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN repository secret (see docs/DEPLOYMENT.md)"; exit 1; }
          mkdir -p /tmp/space && cp -r backend/. /tmp/space/
          rm -rf /tmp/space/resumes /tmp/space/.env
          cat > /tmp/space/README.md <<'EOF'
          ---
          title: ResumeAI API
          emoji: 📄
          colorFrom: green
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Backend API for ResumeAI. Deployed automatically from GitHub by the CI/CD workflow.
          EOF
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api, space = HfApi(token=os.environ["HF_TOKEN"]), os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          variables = {
              "CORS_ORIGINS": os.environ["PAGES_ORIGIN"],
              "APP_URL": os.environ["PAGES_URL"],
              "FIREBASE_PROJECT_ID": os.environ.get("FIREBASE_PROJECT_ID", ""),
          }
          for key, value in variables.items():
              if value:
                  api.add_space_variable(space, key, value)
          secrets = {k: os.environ.get(k, "") for k in
                     ["MONGO_URL", "DB_NAME", "GEMINI_API_KEY", "GROQ_API_KEY", "FIRECRAWL_API_KEY", "APIFY_TOKEN", "COMPOSIO_API_KEY"]}
          secrets["GITHUB_TOKEN"] = os.environ.get("GITHUB_TOKEN_FOR_VERIFICATION", "")
          for key, value in secrets.items():
              if value:
                  api.add_space_secret(space, key, value)
          api.upload_folder(folder_path="/tmp/space", repo_id=space, repo_type="space",
                            commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}", delete_patterns="*")
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          PY
